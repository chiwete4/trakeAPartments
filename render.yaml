databases:
  - name: trake-db
    plan: free
    databaseName: trake
    user: trake
services:
  - type: web
    name: trake-apartments
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trake-db
          property: connectionString
      - key: DEMO_PAYMENTS
        value: true
      - key: DEMO_OWNER_USERNAME
        sync: false
      - key: DEMO_OWNER_PASSWORD
        sync: false
