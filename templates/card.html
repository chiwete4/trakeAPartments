{% load static humanize %}<article class="apartment-card"><a class="card-image" href="{% url 'detail' apartment.slug %}"><img src="{% static apartment.image %}" alt="{{ apartment.name }} living area at Trake Apartments by Orleans" loading="lazy" width="1080" height="810"><span>{{ apartment.bedrooms }} BEDROOM{% if apartment.bedrooms > 1 %}S{% endif %}</span><b>↗</b></a><div class="card-content"><div class="card-top"><h3><a href="{% url 'detail' apartment.slug %}">{{ apartment.name }}</a></h3><span>Up to {{ apartment.max_guests }} guests</span></div><p>{{ apartment.description|truncatewords:16 }}</p><div class="card-bottom"><span><strong>₦{{ apartment.nightly_rate|intcomma }}</strong> / night</span><a href="{% url 'book' %}?apartment={{ apartment.pk }}">Book this space ↗</a></div></div></article>
